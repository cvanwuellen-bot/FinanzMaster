<!doctype html><html><head><meta charset=utf-8><meta name="theme-color" content="#12508f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finanzübersicht C</title>
<!-- SheetJS für echte Excel-Dateien. Fehlt es, bleiben CSV-Export und CSV-Import nutzbar. -->
<script src="xlsx.full.min.js"></script>
<script src="capacitor.js"></script>
<script src="config.js"></script>
<script src="app-vor.js"></script>
<style>
:root{
  color-scheme: light;
  /* Grau als Grundton, Blau als einzige Akzentfarbe. Zahlen tragen ihre eigene Farbe:
     grün für Einnahmen und Guthaben, rot für Ausgaben und Fehlbeträge, sonst schwarz. */
  --paper:#eef1f4; --surface:#ffffff; --surface2:#ffffff; --sunk:#e5e9ee;
  --line:#b8c1cb; --line2:#8c98a5;
  --ink:#14181d; --ink2:#3f4954; --muted:#697382; --zahl:#000000;
  --accent:#12508f; --accent2:#1f6fbf; --accent-soft:#dce7f4;
  --pos:#12722f; --neg:#bf1f1a;
  --warn:#4c5b6b; --warn-soft:#dde3ea; --crit:#bf1f1a; --crit-soft:#f6dedd;
  --ok-soft:#dbeee1;
  --s1:#0d3b66; --s2:#1f6fbf; --s3:#5b6b7c; --s4:#4f8fd0;
  --s5:#8c98a5; --s6:#0a2a49; --s7:#7fb0e0; --s8:#aeb8c3;
  --shadow:0 1px 0 rgba(20,24,29,.08), 0 4px 16px rgba(13,59,102,.10);
  --r:0;
  --sans:Arial, Helvetica, "Liberation Sans", sans-serif;
  --serif:Arial, Helvetica, "Liberation Sans", sans-serif;
  --mono:Arial, Helvetica, "Liberation Sans", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0e1216; --surface:#161b21; --surface2:#1c222a; --sunk:#11161b;
    --line:#333d48; --line2:#4b5866;
    --ink:#e9eef4; --ink2:#b0bac6; --muted:#7d8896; --zahl:#f4f7fa;
    --accent:#5ea3e6; --accent2:#83bcf2; --accent-soft:#152a41;
    --pos:#41b667; --neg:#e8756e;
    --warn:#93a2b3; --warn-soft:#232c36; --crit:#e8756e; --crit-soft:#3a1e1d;
    --ok-soft:#12331e;
    --s1:#5ea3e6; --s2:#83bcf2; --s3:#93a2b3; --s4:#3f7fc4;
    --s5:#6b7a8a; --s6:#c3d5e8; --s7:#2f5f96; --s8:#8a95a2;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 4px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0e1216; --surface:#161b21; --surface2:#1c222a; --sunk:#11161b;
  --line:#333d48; --line2:#4b5866;
  --ink:#e9eef4; --ink2:#b0bac6; --muted:#7d8896; --zahl:#f4f7fa;
  --accent:#5ea3e6; --accent2:#83bcf2; --accent-soft:#152a41;
  --pos:#41b667; --neg:#e8756e;
  --warn:#93a2b3; --warn-soft:#232c36; --crit:#e8756e; --crit-soft:#3a1e1d;
  --ok-soft:#12331e;
  --s1:#5ea3e6; --s2:#83bcf2; --s3:#93a2b3; --s4:#3f7fc4;
  --s5:#6b7a8a; --s6:#c3d5e8; --s7:#2f5f96; --s8:#8a95a2;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 4px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";color:var(--zahl)}
/* Zahlen sind schwarz, sofern sie kein Vorzeichen tragen. „mut" gilt für Fließtext, nicht für
   Betraege — in Zahlenfeldern wird es deshalb wieder auf Schwarz gezogen. */
td.n,.tile .val,.kv .v,.barrow .bv,.mitem .mamt{color:var(--zahl)}
td.n.mut,td.num.mut,.tile .val.mut,.kv .v.mut,.barrow .bv.mut,.mitem .mamt.mut{color:var(--zahl)}
.pos,td.n.pos,.kv .v.pos,.tile .val.pos,.mitem .mamt.pos,.barrow .bv.pos{color:var(--pos)}
.neg,td.n.neg,.kv .v.neg,.tile .val.neg,.mitem .mamt.neg,.barrow .bv.neg{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--surface) 92%, transparent);
  border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(6px)}
.hwrap{max-width:1320px;margin:0 auto;padding:8px 18px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hnav{max-width:1320px;margin:0 auto;padding:0 14px 6px}
.brand{display:flex;align-items:baseline;gap:9px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--accent)}
.brand .mark{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--surface2);background:var(--accent);
  padding:3px 6px;border-radius:0;letter-spacing:.02em;align-self:center}
nav.tabs{display:flex;gap:1px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--ink2);padding:5px 10px;border-radius:0;font-weight:500;white-space:nowrap;font-size:13.5px}
nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--surface2)}
.hspacer{flex:1 1 40px}
.hstat{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);padding:5px 10px;font-size:13px}
.iconbtn:hover:not(:disabled){color:var(--ink);border-color:var(--line2)}
.iconbtn:disabled{opacity:.38;cursor:not-allowed}
.undogrp{display:flex;gap:4px}
.star{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;border-radius:0}
.star:hover{color:var(--accent);background:var(--sunk)}
.star.on{color:var(--accent)}
.favdot{color:var(--accent);font-size:11px;vertical-align:1px}
.hint{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);
  margin-top:2px;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
#undoBtn{font-weight:550}
.histrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.histrow:last-child{border-bottom:0}
.histrow .ht{color:var(--muted);font-family:var(--mono);font-size:12px}

main{max-width:1320px;margin:0 auto;padding:20px 20px 90px}
.view{display:none}
.view.on{display:block}
.ptitle{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;color:var(--accent)}
.psub{color:var(--ink2);margin-bottom:20px;max-width:68ch}
.sect{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line2)}
.panel.pad{padding:18px}
.stack{display:grid;gap:16px}
.cols{display:grid;gap:16px;align-items:start}
.cols>*{min-width:0}
@media(min-width:940px){.c-21{grid-template-columns:1.7fr 1fr}.c-11{grid-template-columns:1fr 1fr}}
@media(min-width:1080px){.c-111{grid-template-columns:1fr 1fr 1fr}}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line2);overflow:hidden}
.tile{background:var(--surface);padding:15px 17px}
.tile .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:7px;letter-spacing:-.02em;line-height:1.15}
.tile .sub{font-size:12px;color:var(--ink2);margin-top:5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line2);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border:1px solid var(--line);white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--sunk);color:var(--ink2);font-weight:700;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;z-index:1;border:1px solid var(--line2)}
th.n,td.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--sunk)}
tfoot td{font-weight:700;border:1px solid var(--line2);background:var(--sunk)}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--ink)}
.rowact{display:flex;gap:4px;opacity:.3}
tr:hover .rowact{opacity:1}
.mini{border:1px solid var(--line2);background:var(--surface2);padding:2px 7px;font-size:12px;color:var(--ink2);line-height:1.5}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.mini.dang:hover{color:#fff;background:var(--crit);border-color:var(--crit)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mini:disabled:hover{color:var(--ink2);border-color:var(--line);background:var(--surface2)}

/* ---------- chips / controls ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;font-size:11.5px;font-weight:700;
  border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.open{background:var(--warn-soft);border-color:var(--line2);color:var(--warn)}
.chip.closed{background:var(--ok-soft);border-color:var(--pos);color:var(--pos)}
.chip.alarm{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:0;display:inline-block;flex:none}
.ctrl{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-bottom:15px}
select,input[type=text],input[type=date],input[type=number],textarea{padding:6px 8px;
  border:1px solid var(--line2);background:var(--surface2);color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--accent2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;
  letter-spacing:.04em;text-transform:uppercase}
.fld>input,.fld>select,.fld>textarea{font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.btn{border:1px solid transparent;background:var(--accent);color:#fff;padding:8px 14px;border-radius:0;font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
:root[data-theme="dark"] .btn{color:#08181d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#08181d}}
.btn:hover{filter:brightness(1.08)}
.btn.gh{background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.btn.gh:hover{border-color:var(--line2);filter:none}
.btn.dang{background:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.grow{flex:1;min-width:150px}

/* ---------- month list ---------- */
.mlist{border:1px solid var(--line2);overflow:hidden;background:var(--surface)}
.mgrp{padding:6px 12px;background:var(--sunk);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.mitem{display:grid;grid-template-columns:30px 52px 1fr 118px auto;gap:10px;align-items:center;
  padding:6px 12px;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:0}
.mitem:hover{background:var(--sunk)}
.mitem.done .mlabel{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mitem .mdate{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mitem .mlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .mamt{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
tr.mrow.done .mlabel{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
tr.mrow.carry td:first-child{border-left:3px solid var(--warn)}
tr.mgrprow td{background:var(--sunk);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.tick{width:22px;height:22px;border-radius:0;border:1.5px solid var(--line2);background:var(--surface2);
  display:grid;place-items:center;color:#fff;font-size:13px;padding:0;line-height:1}
.tick.on{background:var(--pos);border-color:var(--pos)}
.tick:disabled{opacity:.4}
.mnote{font-size:11.5px;color:var(--muted)}
tr.frow td{background:var(--surface2);padding:3px 5px;border:1px solid var(--line)}
tr.frow input,tr.frow select{width:100%;padding:3px 5px;font-size:12px}
.kkrow{padding:9px 0;border-top:1px dashed var(--line)}
.kkrow:first-of-type{border-top:0;padding-top:0}
.carry{border-left:3px solid var(--warn);}
/* Die Stelle, an der ein Konto unter seine Warnschwelle rutscht. */
td.kipp{box-shadow:inset 3px 0 0 var(--crit)}
.tile.kipp{box-shadow:inset 0 0 0 2px var(--crit)}

/* ---------- misc ---------- */
.note{background:var(--accent-soft);border-radius:0;padding:11px 14px;font-size:13px;margin-bottom:16px;color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.crit{background:var(--crit-soft)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink2)} .kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.bars{display:grid;gap:5px}
.barrow{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:9px;align-items:center}
.barrow .bn{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:17px;border-radius:0;background:var(--sunk);position:relative;overflow:hidden}
.bar>i{position:absolute;top:0;left:0;height:100%;border-radius:0;display:block}
.barrow .bv{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;min-width:84px}
.stack-bar{display:flex;height:22px;border-radius:0;overflow:hidden;border:1px solid var(--line)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.empty{color:var(--muted);padding:34px;text-align:center;font-size:13.5px}
svg text{fill:var(--ink2);font-family:var(--mono);font-size:10px}
.matrix{overflow:auto;max-height:74vh;border:1px solid var(--line2);background:var(--surface)}
.matrix table{font-size:12px}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;
  border-right:1px solid var(--line2);white-space:nowrap}
.matrix thead th{z-index:3}
.matrix thead th:first-child{z-index:4}
.heat{border-radius:0;padding:1px 5px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(8,14,15,.55);display:none;z-index:60;align-items:flex-start;
  justify-content:center;padding:36px 14px;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);
  width:100%;max-width:540px;padding:20px}
.modal.wide{max-width:760px}
.modal h3{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--accent)}
.modal .lead{color:var(--ink2);font-size:13px;margin:0 0 16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg>*{min-width:0}
.fg .full{grid-column:1/-1}
.mact{display:flex;justify-content:space-between;gap:9px;margin-top:19px}
.mact .r{display:flex;gap:9px;margin-left:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);
  color:var(--paper);padding:10px 17px;border-radius:0;font-weight:500;z-index:80;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}
.closelist{max-height:46vh;overflow:auto;border:1px solid var(--line2)}
.closerow{display:grid;grid-template-columns:1fr 110px 190px;gap:10px;align-items:center;padding:7px 11px;
  border-bottom:1px solid var(--line);font-size:13px}
.closerow:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line2);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface2);color:var(--ink2);padding:3px 9px;font-size:12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#08181d}

/* ---------- einstellbare Spalten ---------- */
table.cfix{table-layout:fixed}
table.cfix th,table.cfix td{overflow:hidden;text-overflow:ellipsis}
table.cfix thead th{position:sticky}
.colgrip{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;
  touch-action:none;user-select:none;z-index:2}
.colgrip:hover,.colgrip.act{background:var(--accent2);opacity:.4}
body.resizing{cursor:col-resize;user-select:none}
.colrow{display:grid;grid-template-columns:26px 1fr 96px auto;gap:10px;align-items:center;
  padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.colrow:last-child{border-bottom:0}
.colrow input[type=number]{width:100%;padding:4px 7px}
.collist{border:1px solid var(--line2);max-height:52vh;overflow:auto}

/* ---------- Budget ---------- */
.budgrid{display:grid;grid-template-columns:1fr minmax(160px,240px) 150px;gap:8px 14px;align-items:center}
.budgrid input[type=number]{width:100%;padding:5px 8px;text-align:right}
.budgrid .bl{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Kontextmenü ---------- */
.ctxmenu{position:fixed;z-index:90;min-width:224px;max-width:320px;background:var(--surface2);
  border:1px solid var(--line2);border-radius:0;box-shadow:var(--shadow);padding:5px;
  display:flex;flex-direction:column}
.ctxmenu button{border:0;background:none;text-align:left;padding:7px 11px;border-radius:0;
  color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxmenu button:hover:not(:disabled){background:var(--sunk)}
.ctxmenu button:disabled{opacity:.4;cursor:not-allowed}
.ctxmenu button.dang{color:var(--crit)}
.ctxmenu button.dang:hover:not(:disabled){background:var(--crit);color:#fff}
.ctxkopf{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:5px 11px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxsep{height:1px;background:var(--line);margin:4px 6px}
[data-ctx]{-webkit-touch-callout:none}

/* ---------- Mandanten ---------- */
.mandbox{display:flex;align-items:center;gap:6px}
.mandbox select{padding:4px 7px;font-size:13px;max-width:230px}
.mandbox .schloss{font-size:12px;color:var(--muted)}
.mandrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--line)}
.mandrow:last-child{border-bottom:0}
.mandrow.akt{background:var(--accent-soft)}
.mandrow .mn{font-weight:600}
.mandliste{border:1px solid var(--line2);background:var(--surface)}
@media(max-width:700px){
  .mandrow{grid-template-columns:1fr}
  .mandrow .rowact{justify-content:flex-start}
  .mandbox select{max-width:150px}
}

/* ---------- Import ---------- */
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;margin-bottom:7px}
.maprow select{width:100%}
.prev{overflow:auto;max-height:34vh;border:1px solid var(--line2);background:var(--surface2)}
.prev table{font-size:12px}

<script>
/* ============================================================
   Finanzübersicht C · v4.6
   Datenhaltung: Artifact-Datenbank (führend), localStorage als Spiegel
   Datenmodell:  eigene Kennungen (uid), Änderungsstempel (u/dv), Grabsteine (weg) — siehe unten
   Neu in v3.6:  Kreditkarten mit eigenem Abrechnungsstichtag — siehe „Kreditkarten“
   Neu in v3.7:  Abrechnungsdialog mit frei wählbarem Betrag (Teilabrechnung bleibt offen),
                 Budgets je Kategorie mit eigenem Turnus statt Gruppenbudgets,
                 Sortieren und Filtern in „Vorlagen und Turnus" und in der Monatsliste,
                 dynamische Rücklage für turnusmäßige Ausgaben — siehe „Rücklage"
   Neu in v3.8:  beliebig viele dynamische Umbuchungen; das Häkchen an der Turnus-Position trägt
                 den Namen derjenigen, in die sie einfließt
   Neu in v3.9:  Die Kartenabrechnung rechnet über den **Saldo** der Karte statt über die Summe
                 der erfassten Umsätze — siehe „Kreditkarten"
   Neu in v4.0:  Austausch mit der lokalen Fassung: Die Datendatei aus dem OneDrive-Ordner
                 lässt sich hier einlesen — datensatzweise zusammengeführt, nicht überschrieben —
                 und ebenso wieder schreiben. Siehe „Austausch mit der lokalen Fassung".
   Neu in v4.1:  **Budgets** sind eigene Datensätze in `state/budgets` mit eigenem Reiter, eigener
                 Periode (täglich bis jährlich, am Kalender) und ausdrücklicher Zuordnung über das
                 Feld `bud` an Buchungen, Umbuchungen, Turnus-Positionen, Vormerkungen und Vorlagen.
                 Verbrauch, geplanter Rest und Prozent je Periode, Periodenblätterung, Detailansicht
                 mit Zuordnungshilfe. Die Kategoriebudgets aus v3.7 (`meta.katBudget`) und die
                 Vorlagenart „Budget" sind ersatzlos entfallen — siehe „Budgets".
   Neu in v4.2:  Das Budget nennt eine **Kategorie** statt einer Gruppe (`kategorie`) — rein zur
                 Ordnung: die Übersicht sortiert und gruppiert danach, gerechnet wird weiter
                 allein über die ausdrückliche Zuordnung. Dazu ein Feld **Art** (`art`:
                 ausgabe | einnahme); der Betrag wird immer positiv eingegeben, die Art setzt
                 das Vorzeichen. Der Haken „auf die Monate verteilen" steht nur noch bei
                 mehrmonatlich und jährlich zur Wahl, ist im Standard **aus**, und verteilt
                 dann von einem Fälligkeitsmonat bis zum nächsten statt über den
                 Jahresdurchschnitt — siehe `budAnteil`.
   Neu in v4.3:  Eine **Vormerkung wirkt sofort** in der Monatsliste ihres Fälligkeitsmonats —
                 Anlegen, Ändern, Verschieben und Löschen führen vorhandene Listen nach, ohne
                 „Liste aktualisieren". Siehe `vorNachfuehren`. Dazu: Der Kasten
                 „Favoriten-Konten" steht in der Übersicht jetzt oben.
   Neu in v4.4:  Die Favoriten-Konten stehen als **Kachelreihe** da — so groß wie die Kacheln
                 der Übersicht — und dieselbe Reihe erscheint im Reiter Monat oberhalb der
                 Buchungen. Eine Funktion für beide: `favKacheln()`.
   Neu in v4.5:  Die Monatsliste hat die Spalte **„Stand danach"**: der heutige Kontostand,
                 fortgerechnet mit den offenen Positionen des Monats — chronologisch, unabhängig
                 von der Sortierung. Siehe `standDanach`.
   Neu in v4.6:  **Unterdeckung.** Je liquidem Konto wird tagesgenau vorausgerechnet, wann sein
                 Stand unter die neue **Warnschwelle** (`a.schwelle`, Standard 0 €) rutscht.
                 Der Vermerk steht in der Übersicht unter den Favoriten-Kacheln und im Reiter
                 Monat oberhalb der Buchungen, die Kachel und die auslösende Zeile der
                 Monatsliste werden markiert. Siehe `unterdeckung`.
   ============================================================ */
"use strict";

const S = { meta:null, accounts:[], turnus:[], vorlagen:[], vorgemerkt:[], budgets:[], months:{} };
let DB = null, DBSTATE = 'laden';   // laden | online | offline
const LS = 'finanzuebersichtC_v2';

/* ============================================================
   Mandanten
   Ein Mandant ist ein vollständig eigener Datenbestand: eigene Konten, Kategorien, Buchungen,
   Monate, Vorlagen und eigene Wiederherstellungspunkte. Genau einer ist aktiv; alle Ansichten
   zeigen nur dessen Daten.

   Wo die Daten liegen, entscheidet der **Zweig**:

   | Zweig     | Verzeichniseintrag | Daten                                             |
   |-----------|--------------------|---------------------------------------------------|
   | `alt`     | `privat/<id>`      | `state/…`, `months/…`, `punkte/…` (ohne Präfix)   |
   | `privat`  | `privat/<id>`      | `privat/<id>/state/…` usw.                        |
   | `geteilt` | `geteilt/<id>`     | `geteilt/<id>/state/…` usw.                       |

   `alt` gibt es genau einmal: der gewachsene Bestand aus v3.4 bleibt liegen, wo er war — ein
   Umzug von 4.000 Buchungen wäre ein Risiko ohne Gegenwert. Die Zugriffsregeln der
   Veröffentlichung stellen `state`, `months`, `punkte` und `privat` auf **nur der Eigentümer**;
   `geteilt` sieht jeder, der das Artifact geöffnet bekommt. Die Regeln liegen fest in der
   Veröffentlichung — nichts, was diese Seite zur Laufzeit tut, kann sie aufweichen.

   Das Verzeichnis führt nur Name, Zweig und Archivmerker. Weil ein privater Eintrag selbst unter
   `privat/` liegt, bleiben auch die **Namen** privater Mandanten für andere unsichtbar.
   ============================================================ */
let MAND = null;        // aktiver Mandant {id, name, zweig, archiv, notiz, ts}
let MANDS = [];         // alle bekannten Mandanten
let WECHSEL = false;    // während eines Mandantenwechsels entsteht kein Tagespunkt
const LSMAND = 'fuc_mandant';      // welcher Mandant zuletzt aktiv war (je Gerät)
const LSREG  = 'fuc_mandanten';    // Spiegel des Verzeichnisses, damit auch offline etwas dasteht

/** Wurzel eines Mandanten in der Datenbank; leer beim Altbestand. */
const mBase = m => !m ? '' : (m.zweig==='alt' ? '' : m.zweig+'/'+m.id);
/** Vollständiger Dokumentpfad innerhalb eines Mandanten. */
const mP = (sub, m) => { const b=mBase(m===undefined?MAND:m); return b ? b+'/'+sub : sub; };
/** Pfad des Verzeichniseintrags. Der Altbestand wird privat geführt. */
const mRegPfad = m => (m.zweig==='geteilt' ? 'geteilt/' : 'privat/')+m.id;
/** Eigener Spiegel im Browser je Mandant — der Altbestand behält den Schlüssel aus v3.4. */
const mLS = m => { const x=m===undefined?MAND:m; return (!x||x.zweig==='alt') ? LS : LS+'#'+x.zweig+'/'+x.id; };
const mIstPrivat = m => !m || m.zweig!=='geteilt';
const mSichtbar = () => MANDS.filter(m=>!m.archiv);
const mFinden = id => MANDS.find(m=>m.id===id) || null;
/** Kennung aus dem Namen: klein, ohne Sonderzeichen, eindeutig gemacht. */
function mNeueId(name){
  let b=String(name||'mandant').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,28) || 'mandant';
  if(!MANDS.some(m=>m.id===b)) return b;
  for(let i=2;i<999;i++) if(!MANDS.some(m=>m.id===b+'-'+i)) return b+'-'+i;
  return b+'-'+Date.now();
}

/* ---------- Formatierung ---------- */
const EUR  = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const EUR0 = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0});
const f  = n => EUR.format(n||0);
const f0 = n => EUR0.format(n||0);
const sgn = n => n>0.005?'pos':(n<-0.005?'neg':'mut');
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON  = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WT   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const deM  = m => m ? MON[+m.slice(5,7)-1]+' '+m.slice(0,4) : '';
const deML = m => m ? MONL[+m.slice(5,7)-1]+' '+m.slice(0,4) : '';
const deD  = d => d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4) : '';
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const thisYM = () => today().slice(0,7);
const dim = ym => new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
const addM = (ym,n) => { let y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); };
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
const parseDE = s => { const v=parseFloat(String(s).replace(/[−–—]/g,'-')
  .replace(/[\s€]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isNaN(v)?0:v; };

/* ============================================================
   Kennungen, Änderungsstempel, Grabsteine — Vorbereitung auf mehrere Geräte

   Damit zwei Geräte denselben Bestand offline bearbeiten können, darf keine Kennung mehr aus einem
   laufenden Zähler kommen: `meta.nextId` hätte auf Notebook und Handy dieselbe Nummer für zwei
   verschiedene Buchungen vergeben. Neue Datensätze bekommen deshalb eine Kennung, die ein Gerät
   ohne Rückfrage vergeben kann — `uid()`.

   Drei Felder trägt jeder Datensatz, der ab jetzt angefasst wird:

     id / lid   Kennung. Neu eine Zeichenkette aus uid(), alt eine fortlaufende Zahl. Beide stehen
                nebeneinander — deshalb wird überall über sid()/gleich() verglichen und **nie** mehr
                mit === auf +id. Ein `+id` auf eine neue Kennung ergäbe NaN.
     u          Änderungszeit in Sekunden seit 1970.
     dv         Gerät, von dem die letzte Änderung stammt.

   Alte Datensätze werden **nicht** nachträglich gestempelt. Fehlt `u`, gilt der Satz als der
   älteste denkbare Stand — bei „der spätere gewinnt" ist das genau richtig, und es erspart dem
   Bestand 4.000 angefasste Zeilen ohne jeden Gegenwert.

   Gelöscht wird nicht mehr spurlos: jede Löschung hinterlässt einen **Grabstein**
   {typ, id, u, dv}. Ohne ihn wären für ein zweites Gerät „kenne ich nicht" und „wurde gelöscht"
   nicht unterscheidbar — der Datensatz käme beim nächsten Abgleich wieder. Grabsteine für
   Buchungen und Monatslisten stehen im Monatsdokument (`m.weg`), alles Übrige in `meta.weg`.
   Nach GRAB_TAGE Tagen werden sie aufgeräumt; wer länger offline war, gleicht ohnehin über eine
   Sicherung ab.
   ============================================================ */
const DM_STAND = 35;          // Stand des Datenmodells, siehe migrationDatenmodell()
const GRAB_TAGE = 180;        // so lange bleibt ein Grabstein liegen
const LSGER = 'fuc_geraet';

/** Kennung dieses Geräts — vier Zeichen, bleibt im Browser liegen.
    Der Zugriff steht im try/catch: nichts, was beim Laden läuft, darf an einer optionalen
    Browser-Schnittstelle hängen (Falle 8). */
const GERAET = (function(){
  let g=null;
  try{ g=localStorage.getItem(LSGER); }catch(e){}
  if(!g || !/^[a-z0-9]{4}$/.test(g)){
    g=('000'+Math.floor(Math.random()*1679616).toString(36)).slice(-4);
    try{ localStorage.setItem(LSGER, g); }catch(e){}
  }
  return g;
})();
let UID_N = 0;
/** Kennung, die jedes Gerät ohne Rückfrage vergeben kann: Gerät · Zeit · Zähler · Zufall. */
function uid(){
  return GERAET+'-'+Date.now().toString(36)+'-'+(UID_N++).toString(36)+
         '-'+('0'+Math.floor(Math.random()*1296).toString(36)).slice(-2);
}
const jetzt = () => Math.floor(Date.now()/1000);
/** Kennungen vergleichen — alte Zahlen und neue Zeichenketten stehen nebeneinander. */
const sid = v => v==null ? '' : String(v);
/** Zwei Kennungen sind nur gleich, wenn beide eine sind: ohne diese Klemme gälten zwei fehlende
    Kennungen als dieselbe, und eine Buchung ohne Bezug träfe die nächstbeste. */
const gleich = (a,b) => { const x=sid(a); return x!=='' && x===sid(b); };
/** Änderungsstempel setzen: wer hat wann zuletzt angefasst. */
function stempel(o){ if(o && typeof o==='object'){ o.u=jetzt(); o.dv=GERAET; } return o; }
/** Grabsteinliste: ohne Monat die des Bestands, mit Monat die des Monatsdokuments. */
function grabListe(ym){
  if(ym){ const m=S.months[ym]; if(!m) return null; return (m.weg=m.weg||[]); }
  if(!S.meta) return null;
  return (S.meta.weg=S.meta.weg||[]);
}
/** Löschung vermerken. Der Aufrufer sichert das betroffene Dokument selbst über touch(). */
function grabstein(typ, id, ym){
  const l=grabListe(ym); if(!l) return;
  const k=sid(id); if(!k) return;
  const e={typ, id:k, u:jetzt(), dv:GERAET};
  const i=l.findIndex(x=>x.typ===typ && sid(x.id)===k);
  if(i>=0) l[i]=e; else l.push(e);
}
/** Alle Grabsteine des Bestands — für Anzeige und Aufräumen. */
function grabAlle(){
  const o=(((S.meta||{}).weg)||[]).map(x=>Object.assign({ort:'meta'},x));
  monthKeys().forEach(ym=>(((S.months[ym]||{}).weg)||[]).forEach(x=>o.push(Object.assign({ort:ym},x))));
  return o;
}
/** Grabsteine, die älter als GRAB_TAGE sind, fallen weg. */
function grabAufraeumen(){
  const grenze=jetzt()-GRAB_TAGE*86400;
  let n=0;
  const sieben=l=>{ const v=l.filter(x=>(+x.u||0)>=grenze); n+=l.length-v.length; return v; };
  if(S.meta && Array.isArray(S.meta.weg) && S.meta.weg.length){
    const v=sieben(S.meta.weg);
    if(v.length!==S.meta.weg.length){ S.meta.weg=v; touch('meta'); }
  }
  monthKeys().forEach(ym=>{ const m=S.months[ym];
    if(Array.isArray(m.weg) && m.weg.length){
      const v=sieben(m.weg);
      if(v.length!==m.weg.length){ m.weg=v; touch('m:'+ym); }
    } });
  return n;
}
/** Wie weit der Bestand schon auf den Abgleich vorbereitet ist. */
function stempelKz(){
  let mit=0, ohne=0;
  const z=o=>{ if(o && o.u) mit++; else ohne++; };
  S.accounts.forEach(z); S.turnus.forEach(z); (S.vorlagen||[]).forEach(z); S.vorgemerkt.forEach(z);
  (S.budgets||[]).forEach(z);
  monthKeys().forEach(ym=>{ txnsOf(ym).forEach(z); (((S.months[ym]||{}).items)||[]).forEach(z); });
  return {mit, ohne, weg:grabAlle().length};
}
/** Einmalige Umstellung auf das neue Datenmodell.
    Sie stempelt bewusst nichts nach (siehe oben) und gibt nur den Konten eine Kennung: Konten
    werden über ihren Namen angesprochen, und eine Umbenennung auf zwei Geräten wäre ohne eigene
    Kennung nicht auflösbar. Die Zähler `nextId` und Geschwister bleiben unangetastet im Bestand
    liegen, werden aber nirgends mehr gelesen. */
function migrationDatenmodell(){
  if(!S.meta || S.meta.dm>=DM_STAND) return false;
  let ch=false;
  S.accounts.forEach(a=>{ if(!a.id){ a.id=uid(); ch=true; } });
  if(!Array.isArray(S.meta.weg)) S.meta.weg=[];
  S.meta.dm=DM_STAND;
  if(ch) touch('accounts');
  touch('meta');
  return true;
}

function toast(msg,kind){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  t.style.background = kind==='bad' ? 'var(--crit)' : 'var(--ink)';
  t.style.color = kind==='bad' ? '#fff' : 'var(--paper)';
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ---------- Persistenz ---------- */
const DIRTY = new Set();
let flushTimer = null;
function touch(key){
  // `meta` ist ein Dokument ohne einzelne Datensätze — sein Stempel hängt deshalb am Dokument.
  if(key==='meta' && S.meta){ S.meta.u=jetzt(); S.meta.dv=GERAET; }
  DIRTY.add(key); mirror();
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,600);
  tagespunkt();                 // sichert einmal je Tag den Stand vor der ersten Änderung
}
function mirror(){ try{ localStorage.setItem(mLS(), JSON.stringify(S)); }catch(e){} }

function docBody(key){
  if(key==='meta') return S.meta;
  if(key==='accounts') return {items:S.accounts};
  if(key==='turnus') return {items:S.turnus};
  if(key==='vorlagen') return {items:S.vorlagen};
  if(key==='vorgemerkt') return {items:S.vorgemerkt};
  if(key==='budgets') return {items:S.budgets};
  if(key.startsWith('m:')) return S.months[key.slice(2)];
  return null;
}
/** Pfad eines Dokuments im **aktiven** Mandanten. Ohne diese eine Stelle würde jede Schreib-
    und Leseoperation im Altbestand landen — hier hängt die ganze Mandantentrennung. */
function docPath(key){
  if(key.startsWith('m:')) return mP('months/'+key.slice(2));
  return mP('state/'+key);
}
async function flush(){
  if(!DB || !DIRTY.size) return;
  // Solange der Tagespunkt den alten Stand liest, darf nichts überschrieben werden.
  if(PUNKT_LAEUFT){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); return; }
  const keys=[...DIRTY]; DIRTY.clear();
  for(const k of keys){
    const body=docBody(k);
    try{
      if(body==null) await DB.doc(docPath(k)).delete();
      else await DB.doc(docPath(k)).set(JSON.parse(JSON.stringify(body)));
    }
    catch(e){
      DIRTY.add(k);
      if(e && e.code==='revoked'){ DBSTATE='offline'; renderHeaderStat(); }
      toast('Speichern fehlgeschlagen ('+((e&&e.code)||'unbekannt')+') – Daten liegen lokal vor','bad');
      return;
    }
  }
  renderHeaderStat();
}

/* ============================================================
   Wiederherstellungspunkte
   Für jeden Tag, an dem im Tool etwas geändert wird, entsteht genau ein Punkt. Er hält den Stand,
   wie er VOR der ersten Änderung dieses Tages war — also das Ergebnis des letzten Arbeitstags.
   Dieser Stand wird beim Auslösen aus der Datenbank gelesen: dort liegt noch der alte Stand, weil
   `flush()` erst später schreibt und währenddessen angehalten wird.

   Ablage: `punkte/<JJJJ-MM-TT>` (Kopf) und `punkte/<JJJJ-MM-TT>/teile/<n>` (Nutzlast).
   Ein Dokument fasst höchstens 256 KiB, eine Datenbank 5.000 Dokumente — deshalb wird der Stand
   mit gzip gepackt, base64-kodiert und in Stücke geschnitten. Ohne CompressionStream landet der
   reine Text in kleineren Stücken. Zusätzliche Schubladen: `<tag>-hand` (von Hand gesichert) und
   `vor-wiederherstellung` (automatisch vor jedem Zurücksetzen).
   ============================================================ */
const PUNKT_TAGE = 30;            // so viele Arbeitstage werden vorgehalten
const PUNKT_VOR  = 'vor-wiederherstellung';
let PUNKTE = [];                  // Köpfe, neueste zuerst
let PUNKT_LAEUFT = false;         // hält flush() an, solange der alte Stand gelesen wird
let WIEDERHERSTELLUNG = false;    // während des Zurücksetzens entsteht kein neuer Punkt
let PUNKT_FEHLER = null;

function b64Aus(bytes){
  let s=''; const n=0x8000;
  for(let i=0;i<bytes.length;i+=n) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+n));
  return btoa(s);
}
function b64Zu(s){
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
/** Text packen, wenn der Browser es kann — sonst unverändert lassen. */
async function packen(text){
  if(typeof CompressionStream==='undefined') return {roh:text, komprimiert:false};
  try{
    const strom=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf=await new Response(strom).arrayBuffer();
    return {roh:b64Aus(new Uint8Array(buf)), komprimiert:true};
  }catch(e){ return {roh:text, komprimiert:false}; }
}
async function entpacken(roh, komprimiert){
  if(!komprimiert) return roh;
  const strom=new Blob([b64Zu(roh)]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(strom).text();
}
const punktUmfang = o => ({
  buchungen: Object.values(o.months||{}).reduce((s,m)=>s+((m.txns||[]).length),0),
  monate: Object.keys(o.months||{}).length,
  konten: (o.accounts||[]).length,
  turnus: (o.turnus||[]).length,
  vorlagen: (o.vorlagen||[]).length,
  vorgemerkt: (o.vorgemerkt||[]).length,
  budgets: (o.budgets||[]).length
});

/** Den Stand liest der Punkt aus der Datenbank — dort steht er noch ohne die laufende Änderung.
    Ohne Angabe gilt der aktive Mandant; mit Angabe lässt sich auch ein anderer lesen (Kopieren). */
async function standAusDb(m){
  const [meta,acc,tur,vlg,vor,bud,mon] = await Promise.all([
    DB.doc(mP('state/meta',m)).get(), DB.doc(mP('state/accounts',m)).get(),
    DB.doc(mP('state/turnus',m)).get(), DB.doc(mP('state/vorlagen',m)).get(),
    DB.doc(mP('state/vorgemerkt',m)).get(), DB.doc(mP('state/budgets',m)).get(),
    DB.collection(mP('months',m)).get()
  ]);
  if(!meta.exists) return null;
  const o={meta:meta.data(), accounts:(acc.exists&&acc.data().items)||[],
           turnus:(tur.exists&&tur.data().items)||[], vorlagen:(vlg.exists&&vlg.data().items)||[],
           vorgemerkt:(vor.exists&&vor.data().items)||[], budgets:(bud.exists&&bud.data().items)||[],
           months:{}};
  mon.docs.forEach(d=>{ const v=d.data(); o.months[v.ym||d.id]=v; });
  return o;
}

async function punktSchreiben(id, tag, stand, hinweis, m){
  const text=JSON.stringify(stand);
  const {roh, komprimiert}=await packen(text);
  const grenze = komprimiert ? 200000 : 90000;      // Dokumentgrenze sind 256 KiB
  const teile=[];
  for(let i=0;i<roh.length;i+=grenze) teile.push(roh.slice(i,i+grenze));
  const alt=await DB.doc(mP('punkte/'+id,m)).get();
  const altN=(alt.exists && alt.data().teile) || 0;
  for(let i=0;i<teile.length;i++) await DB.doc(mP('punkte/'+id+'/teile/'+i,m)).set({d:teile[i]});
  for(let i=teile.length;i<altN;i++) await DB.doc(mP('punkte/'+id+'/teile/'+i,m)).delete();
  const kopf={id, tag, ts:new Date().toISOString(), teile:teile.length, komprimiert,
              zeichen:text.length, bytes:roh.length, hinweis, umfang:punktUmfang(stand)};
  await DB.doc(mP('punkte/'+id,m)).set(kopf);
  return kopf;
}
async function punktLesen(id, m){
  const kopf=await DB.doc(mP('punkte/'+id,m)).get();
  if(!kopf.exists) throw new Error('Punkt fehlt');
  const k=kopf.data();
  let roh='';
  for(let i=0;i<k.teile;i++){
    const t=await DB.doc(mP('punkte/'+id+'/teile/'+i,m)).get();
    if(!t.exists) throw new Error('Teil '+i+' fehlt');
    roh+=t.data().d;
  }
  return JSON.parse(await entpacken(roh, k.komprimiert));
}
async function punktLoeschen(id, teile, m){
  for(let i=0;i<(teile||0);i++){ try{ await DB.doc(mP('punkte/'+id+'/teile/'+i,m)).delete(); }catch(e){} }
  await DB.doc(mP('punkte/'+id,m)).delete();
}
async function punkteLaden(){
  if(!DB){ PUNKTE=[]; return PUNKTE; }
  try{
    const c=await DB.collection(mP('punkte')).get();
    PUNKTE=c.docs.map(d=>clone(d.data())).filter(p=>p&&p.id)
      .sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
    PUNKT_FEHLER=null;
  }catch(e){ PUNKTE=[]; PUNKT_FEHLER=(e&&e.code)||'unbekannt'; }
  return PUNKTE;
}
/** Über 30 Arbeitstage hinaus aufräumen; die Sonderschubladen bleiben unangetastet. */
async function punkteAufraeumen(){
  const tage=[...new Set(PUNKTE.filter(p=>p.tag && p.id!==PUNKT_VOR).map(p=>p.tag))].sort().reverse();
  const behalten=new Set(tage.slice(0, PUNKT_TAGE));
  const weg=PUNKTE.filter(p=>p.id!==PUNKT_VOR && p.tag && !behalten.has(p.tag));
  for(const p of weg){ try{ await punktLoeschen(p.id, p.teile); }catch(e){} }
  if(weg.length) await punkteLaden();
  return weg.length;
}
/** Läuft bei jeder Änderung mit; schreibt höchstens einen Punkt je Tag. */
async function tagespunkt(){
  if(!DB || PUNKT_LAEUFT || WIEDERHERSTELLUNG || WECHSEL) return;
  const t=today();
  if(S.meta && S.meta.letzterPunkt===t) return;
  PUNKT_LAEUFT=true;
  try{
    // Der Punkt eines Tages wird genau einmal geschrieben. Die Merkung in `meta` kann durch ein
    // Rückgängig verlorengehen — deshalb entscheidet die Datenbank, nicht das Gedächtnis.
    const da=await DB.doc(mP('punkte/'+t)).get();
    if(da.exists){ S.meta.letzterPunkt=t; DIRTY.add('meta'); mirror(); return; }
    const stand=await standAusDb();
    if(stand){
      await punktSchreiben(t, t, stand, 'Stand vor der Arbeit am '+deD(t));
      S.meta.letzterPunkt=t; DIRTY.add('meta'); mirror();
      await punkteLaden(); await punkteAufraeumen();
      if(cur==='daten') refresh();
    }
  }catch(e){
    PUNKT_FEHLER=(e&&e.code)||'unbekannt';     // Punkte sind Beiwerk und dürfen nie den Ablauf stören
  }finally{
    PUNKT_LAEUFT=false;
  }
}

/* ---------- Rückgängig / Wiederherstellen ---------- */
const UNDO=[], REDO=[], UNDO_MAX=30;
const clone = o => o==null ? null : JSON.parse(JSON.stringify(o));

/** Zustand der genannten Dokumente sichern, bevor eine Aktion sie ändert. */
function snap(label, keys){
  const docs={}; keys.forEach(k=>{ docs[k]=clone(docBody(k)); });
  UNDO.push({label, ts:Date.now(), docs});
  while(UNDO.length>UNDO_MAX) UNDO.shift();
  REDO.length=0;
}
function applyDocs(docs){
  for(const k in docs){
    const b=docs[k];
    if(k==='meta') S.meta=b;
    else if(k==='accounts') S.accounts=(b&&b.items)||[];
    else if(k==='turnus') S.turnus=(b&&b.items)||[];
    else if(k==='vorlagen') S.vorlagen=(b&&b.items)||[];
    else if(k==='vorgemerkt') S.vorgemerkt=(b&&b.items)||[];
    else if(k==='budgets') S.budgets=(b&&b.items)||[];
    else if(k.startsWith('m:')){ const ym=k.slice(2); if(b) S.months[ym]=b; else delete S.months[ym]; }
    touch(k);
  }
}
function stepBack(){
  const e=UNDO.pop(); if(!e){ toast('Nichts zum Rückgängigmachen'); return; }
  const back={}; Object.keys(e.docs).forEach(k=>{ back[k]=clone(docBody(k)); });
  REDO.push({label:e.label, ts:e.ts, docs:back});
  applyDocs(e.docs); reindex(); refresh();
  toast('Rückgängig: '+e.label);
}
function stepForward(){
  const e=REDO.pop(); if(!e){ toast('Nichts zum Wiederherstellen'); return; }
  const fwd={}; Object.keys(e.docs).forEach(k=>{ fwd[k]=clone(docBody(k)); });
  UNDO.push({label:e.label, ts:e.ts, docs:fwd});
  applyDocs(e.docs); reindex(); refresh();
  toast('Wiederhergestellt: '+e.label);
}
const allDocKeys = () => ['meta','accounts','turnus','vorlagen','vorgemerkt','budgets'].concat(monthKeys().map(m=>'m:'+m));

/* ---------- Einmalige Umstellung: Umbuchungspaare zu einer Zeile ----------
   Bis v2.2 stand jede Umbuchung als zwei Zeilen in der Buchungsliste (Abgang und Zugang).
   Jetzt ist es eine Zeile mit Zielkonto in `k2`. Zusammengeführt werden nur Zeilen ohne
   Kategorie, mit gleichem Datum und Gegenbetrag, bei denen die Kontonamen über das Feld
   „an/von" zueinander passen. Die Salden ändern sich dabei nicht: der Betrag wirkt weiter
   negativ beim Quell- und positiv beim Zielkonto. Zeilen ohne eindeutigen Partner bleiben
   unverändert stehen.                                                                    */
function mergeUmbuchungen(){
  let paare=0;
  for(const ym of monthKeys()){
    const m=S.months[ym], txns=m.txns||[];
    const um=txns.filter(t=>!t.c && !t.k2);
    const verbraucht=new Set();   // schon gepaart, kommt als Partner nicht mehr in Frage
    const weg=new Set();          // Zugangszeile, die entfällt
    for(const t of um){
      if(verbraucht.has(t.id)) continue;
      const p=(t.p||'').trim(), e=(t.e||'').trim();
      const partner=um.find(x=>{
        if(x===t || verbraucht.has(x.id)) return false;
        if(x.d!==t.d || Math.abs(x.a+t.a)>=0.005) return false;
        const xp=(x.p||'').trim(), xe=(x.e||'').trim();
        if(xp===t.k && x.k===p) return true;                 // beide Richtungen passen
        return (xp===t.k || x.k===p) && xe===e;              // eine Richtung plus gleiche Bemerkung
      });
      if(!partner) continue;
      verbraucht.add(t.id); verbraucht.add(partner.id); paare++;
      const ab = t.a<0 ? t : partner, zu = t.a<0 ? partner : t;
      ab.k2 = zu.k;
      // „an/von" enthielt bisher nur das Gegenkonto – das steht jetzt in der eigenen Spalte
      if(!ab.p || ab.p.trim()===zu.k || ab.p.trim()===ab.k) ab.p='';
      if(!ab.e && zu.e) ab.e = zu.e;
      weg.add(zu.id);                                        // nur die Zugangszeile entfällt
    }
    if(weg.size){ m.txns = txns.filter(t=>!weg.has(t.id)); touch('m:'+ym); }
  }
  return paare;
}

/** Zum Mandanten wechseln: erst alles Ausstehende schreiben, dann neu laden.
    Der Zurück-Verlauf wird geleert — ein Schritt aus dem alten Bestand würde sonst in den
    neuen zurückschreiben. */
async function mandWechseln(id, still){
  const m=mFinden(id); if(!m) return false;
  if(MAND && MAND.id===id) return true;
  WECHSEL=true;
  try{
    clearTimeout(flushTimer);
    if(MAND){ try{ await flush(); }catch(e){} }   // ohne aktiven Mandanten gibt es kein Ziel
    DIRTY.clear();
    UNDO.length=0; REDO.length=0;
    MAND=m;
    try{ localStorage.setItem(LSMAND, m.id); }catch(e){}
    S.meta=null; S.accounts=[]; S.turnus=[]; S.vorlagen=[]; S.vorgemerkt=[]; S.budgets=[]; S.months={};
    PUNKTE=[]; PUNKT_FEHLER=null;
    await loadAll();
    if(!S.meta){ Object.assign(S, mandGeruest(m.name)); ['meta','accounts','turnus','vorlagen','vorgemerkt','budgets'].forEach(k=>DIRTY.add(k)); }
    reindex();
    migrationDatenmodell();   // jeder Mandant wird für sich umgestellt
    rueckFrischen();
    UI.monat = openMonths().slice(-1)[0] || monthKeys().slice(-1)[0] || thisYM();
    UI.liqui = S.meta.liquiHorizont || 12;
    UI.q=''; UI.kat=null;
  } finally { WECHSEL=false; }
  if(DIRTY.size) await flush();
  renderMandbox(); renderHeaderStat();
  if(!still) refresh();
  punkteLaden().then(()=>{ if(cur==='daten'||cur==='mandanten') refresh(); });
  return true;
}
/** Neuen Mandanten anlegen; `stand` ist wahlweise ein fertiger Datenbestand (Kopie, Sicherung). */

/** Einen Stand aus einem Mandanten holen — aus dem Speicher, wenn er der aktive ist. */
async function standVon(m){

  if(!DB) throw new Error('keine Datenbank');
